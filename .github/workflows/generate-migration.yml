# Temporary: creates the initial EF Core migration, then gets removed.
name: Generate initial migration

on:
  push:
    branches: [phase-5-api]
    paths: ['.github/workflows/generate-migration.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      - name: Add migration
        working-directory: api
        run: |
          if [ -d src/Portfolio.Infrastructure/Persistence/Migrations ]; then echo "Already exists"; exit 0; fi
          dotnet ef migrations add InitialCreate -p src/Portfolio.Infrastructure -s src/Portfolio.Api -o Persistence/Migrations
      - name: Commit migration
        run: |
          git config user.name "Daniel"
          git config user.email "202210815@ua.edu.lb"
          git add api/src/Portfolio.Infrastructure/Persistence/Migrations
          git diff --cached --quiet && exit 0
          git commit -m "Add initial database migration"
          git push
