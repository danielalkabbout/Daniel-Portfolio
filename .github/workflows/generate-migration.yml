# Temporary: creates the AddPersonalLinks EF Core migration, then gets removed.
name: Generate migration

on:
  push:
    branches: [personal-links]
    paths: ['.github/workflows/generate-migration.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      - name: Add migration
        working-directory: api
        run: |
          if ls src/Portfolio.Infrastructure/Persistence/Migrations/*_AddPersonalLinks.cs >/dev/null 2>&1; then echo "Already exists"; exit 0; fi
          dotnet restore Portfolio.slnx
          dotnet build src/Portfolio.Api --no-restore
          dotnet ef migrations add AddPersonalLinks -p src/Portfolio.Infrastructure -s src/Portfolio.Api -o Persistence/Migrations --no-build
      - name: Commit migration
        run: |
          git config user.name "Daniel"
          git config user.email "202210815@ua.edu.lb"
          git add api/src/Portfolio.Infrastructure/Persistence/Migrations
          git diff --cached --quiet && exit 0
          git commit -m "Add migration for personal links"
          git push
