name: Web lint, test and build

# Checks pull requests. On main, the Pipeline workflow calls this before deploying.
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_call:

# The workflow only reads the code; it never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
