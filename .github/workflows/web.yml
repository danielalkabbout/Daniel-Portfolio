name: Web lint, test and build

# Checks every pull request (the main branch's ruleset requires these checks, so they must always run). On main, the Pipeline workflow calls this before deploying.
on:
  pull_request:
  workflow_call:

# The workflow only reads the code; it never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
